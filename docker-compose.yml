networks:
  mysql:
    name: mysql

services:
  php:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./volumes/suitecrm:/var/www/html
      - ~/.composer:/root/.composer
    environment:
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-off}
      TZ: ${TZ:-UTC}
    networks:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m

  # This local database is for development and first-time installs only.
  # Production may use the existing external database on the same network.
  mysql:
    image: mysql:8.4
    profiles: ["dev-db"]
    restart: unless-stopped
    volumes:
      - ./volumes/mysql/dump:/docker-entrypoint-initdb.d
      - ./volumes/mysql/data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-suitecrm}
      MYSQL_USER: ${MYSQL_USER:-suitecrm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mysql

  messenger:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    profiles: ["background"]
    restart: unless-stopped
    user: www-data
    command:
      - php
      - bin/console
      - messenger:consume
      - internal-async
      - --time-limit=3600
      - --memory-limit=256M
    volumes:
      - ./volumes/suitecrm:/var/www/html
    depends_on:
      php:
        condition: service_started
    stop_grace_period: 30s
    networks:
      - mysql

  scheduler:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    profiles: ["background"]
    restart: unless-stopped
    user: www-data
    command:
      - sh
      - -ec
      - while :; do php bin/console schedulers:run --no-interaction; sleep 60; done
    volumes:
      - ./volumes/suitecrm:/var/www/html
    depends_on:
      php:
        condition: service_started
    networks:
      - mysql
