networks:
  mysql:
    name: mysql

services:
  php:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./volumes/suitecrm:/var/www/html
      - ~/.composer:/root/.composer
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-off}
      TZ: ${TZ:-UTC}
    networks:
      - mysql
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - ./volumes/mysql/dump:/docker-entrypoint-initdb.d
      - ./volumes/mysql/data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-suitecrm}
      MYSQL_USER: ${MYSQL_USER:-suitecrm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mysql

  messenger:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: unless-stopped
    user: www-data
    command:
      - php
      - bin/console
      - messenger:consume
      - internal-async
      - --time-limit=3600
      - --memory-limit=256M
    volumes:
      - ./volumes/suitecrm:/var/www/html
    depends_on:
      php:
        condition: service_started
    networks:
      - mysql
    profiles: ["background"]

  scheduler:
    image: ghcr.io/librecodecoop/suitecrm-docker/suite-crm:latest
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: unless-stopped
    user: www-data
    command:
      - sh
      - -c
      - while true; do php -f public/legacy/cron.php; sleep 300; done
    volumes:
      - ./volumes/suitecrm:/var/www/html
    depends_on:
      php:
        condition: service_started
    networks:
      - mysql
    profiles: ["background"]
