name: Publish Suite-CRM Docker Image

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/suite-crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read SuiteCRM version
        id: suitecrm
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < SUITECRM_VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SuiteCRM version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Test scripts and Compose
        shell: bash
        run: |
          bash -n install.sh scripts/upgrade-suitecrm.sh .docker/php/scripts/entrypoint.sh
          bats tests/scripts.bats tests/compose.bats

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for runtime verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          pull: true
          push: false
          load: true
          tags: suitecrm-ci:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test packaged application and PHP runtime
        env:
          SUITECRM_TEST_IMAGE: suitecrm-ci:verify
        run: bats tests/image.bats

      - name: Log in to Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.suitecrm.outputs.version }}

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
