name: Publish Suite-CRM Docker Image

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/suite-crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read SuiteCRM version
        id: suitecrm
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < SUITECRM_VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SuiteCRM version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate scripts and runtime compatibility policy
        shell: bash
        run: |
          bash -n install.sh scripts/upgrade-suitecrm.sh .docker/php/scripts/entrypoint.sh
          python3 scripts/check-runtime-compatibility.py
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for runtime verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          pull: true
          push: false
          load: true
          tags: suitecrm-ci:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test built PHP runtime and packaged SuiteCRM
        shell: bash
        run: |
          docker run --rm --entrypoint php suitecrm-ci:verify -r '
            $required = ["apcu", "gd", "imap", "intl", "ldap", "mysqli", "pdo_mysql", "soap", "zip"];
            foreach ($required as $ext) {
              if (!extension_loaded($ext)) {
                fwrite(STDERR, "Missing PHP extension: $ext\n");
                exit(1);
              }
            }
            if (ini_get("memory_limit") !== "512M") {
              fwrite(STDERR, "memory_limit does not satisfy image policy\n");
              exit(1);
            }
            if (ini_get("post_max_size") !== "36M" || ini_get("upload_max_filesize") !== "30M") {
              fwrite(STDERR, "Invalid POST/upload limits\n");
              exit(1);
            }
            if (ini_get("log_errors") !== "1" || ini_get("display_errors") !== "") {
              fwrite(STDERR, "Invalid error reporting policy\n");
              exit(1);
            }
            echo "PHP runtime smoke check OK\n";
          '
          expected="$(tr -d '[:space:]' < SUITECRM_VERSION)"
          installed="$(docker run --rm --entrypoint cat suitecrm-ci:verify /etc/suitecrm-version)"
          test "$installed" = "$expected"
          docker run --rm --entrypoint test suitecrm-ci:verify -f /opt/suitecrm/VERSION

      - name: Log in to Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.suitecrm.outputs.version }}

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
